<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#D8222D">
<meta name="description" content="الحسابات الرسمية لداوود النبلاء على فيسبوك وإنستغرام.">
<title>داوود النبلاء | تواصل معنا</title>
<style>
  :root { --red:#D8222D; --red-deep:#B61926; --ink:#221E20; --muted:#7A7475; --bg:#FAF7F6; }
  * { box-sizing:border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin:0; min-height:100svh; background:var(--bg); font-family:Tahoma,Arial,"Noto Sans Arabic",sans-serif; color:var(--ink); }
  body::before { content:""; display:block; position:fixed; inset:0 0 auto; height:min(52vh,390px); background: radial-gradient(ellipse at 80% -30%, #f05a62 0, transparent 58%),linear-gradient(145deg,#D8222D,#B71927); z-index:-1; }
  .layout { min-height:100svh; display:flex; align-items:center; justify-content:center; padding:52px 18px 42px; }
  .panel { width:min(100%,440px); background:#FFF; border-radius:30px; overflow:hidden; box-shadow:0 22px 60px rgba(72,14,24,.14); }
  .cover { color:white; background:radial-gradient(ellipse at top right,#f34955 -30%, transparent 64%),linear-gradient(140deg,#D8222D,#BB1927); text-align:center; padding:37px 24px 34px; }
  .logo { display:block; margin:0 auto 19px; width:150px; height:150px; object-fit:cover; border-radius:24px; border:5px solid #fff; box-shadow:0 7px 18px rgba(58,5,11,.20); background:#fff; }
  h1 { font-size:29px; line-height:1.5; margin:0 0 4px; font-weight:800; letter-spacing:-.6px; }
  .tagline { margin:0; font-size:14px; opacity:.92; line-height:1.8; }
  .details { padding:31px 23px 32px; }
  .intro { text-align:center; font-size:15px; line-height:1.9; color:#686164; margin:0 0 22px; }
  .links { display:flex; flex-direction:column; gap:13px; }
  .social { color:var(--ink); display:flex; align-items:center; gap:14px; padding:15px; min-height:83px; border:1px solid #EEE8E8; border-radius:19px; text-decoration:none; background:white; box-shadow:0 5px 14px rgba(25,13,14,.035); transition:transform .17s, border-color .17s, box-shadow .17s; }
  .social:hover,.social:focus-visible { transform:translateY(-2px); border-color:#E8C8CA; box-shadow:0 9px 19px rgba(28,12,13,.09); }
  .social:focus-visible { outline:3px solid #F3A9AF; outline-offset:3px; }
  .icon { display:grid; place-items:center; flex:none; width:51px; height:51px; border-radius:14px; color:#fff; }
  .facebook { background:#1877F2; }
  .instagram { background:linear-gradient(35deg,#ffbe3d 0%,#ed474b 35%,#c62e91 70%,#6340c3 100%); }
  svg { width:27px; height:27px; display:block; fill:white; }
  .textgroup { display:block; text-align:right; flex:1; }
  .platform { display:block; font-size:17px; font-weight:800; margin-bottom:3px; }
  .handle { display:block; color:var(--muted); font-size:12.5px; font-weight:400; direction:ltr; text-align:right; }
  .arrow { flex:none; color:#9A9597; width:24px; height:24px; stroke:currentColor; fill:none; stroke-width:2; }
  .footer { text-align:center; color:#978F92; font-size:12px; margin:25px 0 0; }
  @media(max-width:350px) { .panel{border-radius:22px} .cover{padding:26px 16px}.details{padding:25px 16px}.logo{width:128px;height:128px}h1{font-size:25px} }
  @media(prefers-reduced-motion:reduce) { .social{transition:none} }
</style>
